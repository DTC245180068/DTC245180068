services:
  # ====================================================================
  # 1. DATABASE - PostgreSQL (Hardened & Isolated)
  # ====================================================================
  postgres:
    image: postgres:16
    container_name: billing-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing_db}
      POSTGRES_USER: ${POSTGRES_USER:-billing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongBillingPass_2026!#}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing_user} -d ${POSTGRES_DB:-billing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # 2. DATABASE MANAGEMENT TOOL - pgAdmin 4
  # ====================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: billing-pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@billing.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminPass_2026!#}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 8080
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:8080"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy

  # ====================================================================
  # 3. WEB APPLICATION - Node.js Billing Management System (Non-Root)
  # ====================================================================
  billing-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: billing-app
    restart: unless-stopped
    user: "10001:10001" # Hardening: Non-root user
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: 3000
      POSTGRES_DB: ${POSTGRES_DB:-billing_db}
      POSTGRES_USER: ${POSTGRES_USER:-billing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongBillingPass_2026!#}
      DB_HOST: postgres
      DB_PORT: 5432
      LOG_DIR: /var/log/app
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
      - app_logs:/var/log/app
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy

  # ====================================================================
  # 4. REVERSE PROXY - Nginx with Self-Signed SSL & Security Headers
  # ====================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: billing-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      - billing-app

  # ====================================================================
  # 5. MONITORING - Prometheus Server
  # ====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: billing-prometheus
    restart: unless-stopped
    user: "65534:65534" # Hardening: nobody user
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring-net
    depends_on:
      - billing-app

  # ====================================================================
  # 6. MONITORING - Grafana Dashboards & Log Exploration
  # ====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: billing-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.8
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-GrafanaAdmin_2026!#}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/billing-overview.json"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - prometheus

  # ====================================================================
  # 7. EXPORTER - PostgreSQL Prometheus Exporter
  # ====================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: billing-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring_user:Monitor_2026_ReadOnly99!@postgres:5432/${POSTGRES_DB:-billing_db}?sslmode=disable"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy

  # ====================================================================
  # 8. EXPORTER - Nginx Prometheus Exporter
  # ====================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: billing-nginx-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.3
    command:
      - "-nginx.scrape-uri=http://nginx:80/nginx_status"
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - nginx

  # ====================================================================
  # 9. EXPORTER - Google cAdvisor (Container Resource Metrics)
  # ====================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: billing-cadvisor
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  # ====================================================================
  # 12. EXPORTER - Prometheus Node Exporter (Host System Metrics)
  # ====================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: billing-node-exporter
    restart: unless-stopped
    hostname: billing-host
    mem_limit: 128m
    cpus: 0.3
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring-net


networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  app_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
