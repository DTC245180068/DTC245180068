server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape Node.js Billing Application Logs
  - job_name: billing-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: billing-app
          container: billing-app
          service: billing-service
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            method: method
            url: url
            statusCode: statusCode
            responseTimeMs: responseTimeMs
            message: message
      - labels:
          level:
          method:
          statusCode:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # 2. Scrape Nginx Reverse Proxy Logs
  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          container: billing-nginx
          service: reverse-proxy
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            remote_addr: remote_addr
            request: request
            status: status
            request_time: request_time
            upstream_response_time: upstream_response_time
      - labels:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339

  # 3. Scrape Standard Docker Container Logs
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: tag
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
