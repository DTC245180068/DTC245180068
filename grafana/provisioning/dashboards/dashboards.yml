apiVersion: 1

providers:
  - name: 'Billing System Dashboards'
    orgId: 1
    folder: 'Billing Management'
    folderUid: 'billing-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
